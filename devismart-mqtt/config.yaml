# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Devismart MQTT (patched)
version: "0.5.1-patched"
slug: devismart-mqtt
description: Devismart MQTT Addon - full Danfoss grid server list, resilient reconnection
url: "https://github.com/julienma/ha-devireg-mqtt-addon"
arch:
  - aarch64
  - amd64
init: false
startup: application
ports:
  8000/tcp: 8000
services:
  - mqtt:need
map:
  - addon_config:rw
options:
  host: core-mosquitto
  port: 1883
  user: ""
  password: ""
schema:
  host: str
  port: port
  user: str
  password: password
